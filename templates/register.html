<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign up • Instagram</title>
  <style>
    body {
      background-color: #fafafa;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .signup-container {
      background-color: #fff;
      border: 1px solid #dbdbdb;
      padding: 40px 40px 20px;
      width: 350px;
      text-align: center;
    }

    .logo {
      font-family: 'Billabong', cursive;
      font-size: 48px;
      margin-bottom: 20px;
      color: #262626;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      padding: 9px;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      background-color: #fafafa;
      font-size: 14px;
    }

    input[type="submit"] {
      background-color: #0095f6;
      color: white;
      border: none;
      padding: 10px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .switch {
      margin-top: 20px;
      font-size: 14px;
    }

    .switch a {
      color: #0095f6;
      text-decoration: none;
      font-weight: bold;
    }

    .or {
      display: flex;
      align-items: center;
      margin: 20px 0;
    }

    .or::before,
    .or::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #dbdbdb;
    }

    .or span {
      margin: 0 10px;
      color: #8e8e8e;
      font-weight: bold;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="logo">Instagram</div>
    <form method="post">
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="submit" value="Sign Up">
    </form>
    <div class="or"><span>OR</span></div>
    <div class="switch">
      Have an account? <a href="{{ url_for('login') }}">Log in</a>
    </div>
  </div>
</body>
</html>
