<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>
<body>
    <h1>Welcome to Instagram Clone</h1>
    <div>
        {% for post in posts %}
            <div class="post">
                <img src="{{ post[2] }}" alt="Post image">
                <p>{{ post[3] }}</p>
                <a href="{{ url_for('profile', user_id=post[1]) }}">View Profile</a>
            </div>
        {% endfor %}
    </div>
    <a href="{{ url_for('post') }}">Create Post</a>
    <a href="{{ url_for('login') }}">Login</a>
</body>
</html>
